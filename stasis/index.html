<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff6f8" />
  <meta name="description" content="Stasis — a tiny shared status space for people who care about each other." />
  <title>stasis ♡</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script>
    try {
      const saved = localStorage.getItem("stasis-theme") || "system";
      const resolved = saved === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : saved;
      document.documentElement.dataset.theme = resolved;
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="games.css" />
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <div class="boot-card">
      <div class="boot-heart">♡</div>
      <p>opening stasis…</p>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
