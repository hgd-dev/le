<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A rose for you." />
  <title>a rose for you ♡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="home-link" href="../" aria-label="Back to le home">le ♡</a>

  <main class="reel-stage">
    <video
      id="roseVideo"
      class="rose-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="poster.jpg"
      aria-label="A slowly rotating pink rose animation"
    >
      <source src="rose-reel.mp4" type="video/mp4" />
    </video>
    <button id="pauseButton" class="pause-button" type="button" aria-label="Pause rose animation" aria-pressed="false">Ⅱ</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
