<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f6" />
  <meta name="description" content="A tiny question with one obviously correct answer." />
  <title>Do you like me back? ♡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="home-link" href="../" aria-label="Back to le home">le ♡</a>
  <main class="page" id="page">
    <section class="card" id="questionCard" aria-labelledby="questionTitle">
      <div class="tiny-heart" aria-hidden="true">♡</div>
      <p class="eyebrow">one very important question</p>
      <h1 id="questionTitle">Do you like me back?</h1>
      <p class="caption" id="caption" aria-live="polite">be honest…</p>

      <div class="playground" id="playground" aria-label="Answer choices">
        <button class="answer yes" id="yesButton" type="button">YES ♡</button>
        <button class="answer no" id="noButton" type="button">NO</button>
      </div>

      <p class="hint" id="hint">choose carefully</p>
    </section>

    <section class="ending" id="ending" aria-hidden="true">
      <div class="pulse-heart" id="pulseHeart" aria-hidden="true">♥</div>
      <div class="ending-copy">
        <h2 id="endingTitle">I KNEW IT ♡</h2>
        <p>I like you too.</p>
        <p class="a-lot">Like… a lot.</p>
        <button class="come-here" id="comeHereButton" type="button">come here 🫶</button>
      </div>
    </section>

    <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
