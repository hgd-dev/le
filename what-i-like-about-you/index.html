<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff4f7" />
  <meta name="description" content="A tiny vending machine full of things I like about you." />
  <title>What I Like About You ♡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="home-link" href="../" aria-label="Back to le home">le ♡</a>
  <main class="page-shell">
    <section class="machine" aria-labelledby="page-title">
      <header class="machine-top">
        <div class="brand-mark" aria-hidden="true">♡</div>
        <div>
          <p class="eyebrow">a very important machine</p>
          <h1 id="page-title">what i like about you</h1>
        </div>
      </header>

      <div class="display-panel" aria-live="polite">
        <div class="display-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p id="displayText">ready when you are ♡</p>
      </div>

      <div class="window" aria-hidden="true">
        <div class="window-glow"></div>
        <div class="capsule capsule-one">♡</div>
        <div class="capsule capsule-two">♡</div>
        <div class="capsule capsule-three">♡</div>
        <div class="capsule capsule-four">♡</div>
        <div class="capsule capsule-five">♡</div>
        <div class="spiral"></div>
      </div>

      <div class="controls">
        <div class="price-tag">
          <span>PRICE</span>
          <strong>one kiss</strong>
        </div>

        <button class="vend-button" id="vendButton" type="button">
          <span class="vend-button-shine" aria-hidden="true"></span>
          <span class="vend-button-heart" aria-hidden="true">♡</span>
          <span>PRESS FOR ONE</span>
        </button>
      </div>

      <div class="slot-wrap">
        <div class="slot-label">TAKE ONE ♡</div>
        <div class="slot" id="slot">
          <div class="slot-shadow"></div>
        </div>
      </div>

      <div class="counter-row">
        <p><span id="dispensedCount">0</span> little things dispensed</p>
        <button class="tiny-button" id="resetButton" type="button" title="Start the rotation over">refill ↻</button>
      </div>
    </section>

    <section class="card-stage" id="cardStage" aria-live="polite" aria-atomic="true">
      <article class="compliment-card" id="complimentCard" hidden>
        <div class="card-sticker" id="cardSticker">♡</div>
        <p class="card-kicker" id="cardKicker">TODAY'S PULL</p>
        <p class="card-copy" id="cardCopy"></p>
      </article>
      <p class="tap-hint" id="tapHint">press the button to get one</p>
    </section>
  </main>

  <div class="heart-layer" id="heartLayer" aria-hidden="true"></div>
  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
  <script src="compliments.js"></script>
  <script src="script.js"></script>
</body>
</html>
